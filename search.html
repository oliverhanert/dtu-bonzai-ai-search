<section class="ps-hero" id="ps-hero">
    <h1 class="ps-title">Search DTU Learn for Life</h1>
  <form class="ps-form" id="ps-form" role="search">
    <input type="text" id="ps-input" placeholder="Search courses, programmes, events…" aria-label="Search" autocomplete="off" />
    <button type="button" class="ps-clear" id="ps-clear" aria-label="Clear search" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
    </button>
    <button type="submit" aria-label="Search">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7.5"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
    </button>
  </form>
  <div class="ps-examples" id="ps-examples">
    <span>Popular:</span>
    <button type="button" data-q="leadership">leadership</button>
    <button type="button" data-q="diploma in leadership">diploma in leadership</button>
    <button type="button" data-q="wind energy">wind energy</button>
    <button type="button" data-q="I want to become a leader">I want to become a leader</button>
    <button type="button" data-q="online courses">online courses</button>
    <button type="button" data-q="How do I apply for a diploma programme?">How do I apply for a diploma programme?</button>
  </div>
</section>

<main class="ps-main" id="ps-main" hidden>
  <h1 class="ps-heading sr-only" id="ps-heading"></h1>
  <p class="ps-summary" id="ps-summary" aria-live="polite"></p>
  <div class="ps-toolbar">
    <div class="ps-facets" id="ps-facets"></div>
    <div class="ps-toolbar-right">
      <p class="ps-count" id="ps-count"></p>
      <button type="button" class="ps-reset" id="ps-reset">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        Start over
      </button>
    </div>
  </div>
  <div class="ps-list" id="ps-list"></div>
</main>
